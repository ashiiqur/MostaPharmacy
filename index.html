<style>
:root{--mint:#E6F3EE;--ink:#0B3A33;--muted:#34594F;--green:#0B7A57;--amber:#FFC233;--foil:#D3E1E5}
*{box-sizing:border-box;margin:0}
body{background:var(--mint);color:var(--ink);font:400 1.05rem/1.6 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}

/* Pill shapes (used in the blister pack and in the background) */
.cap{width:78%;aspect-ratio:2.2;border-radius:99px;background:linear-gradient(90deg,var(--c) 50%,#fff 50%);rotate:var(--r,0deg);box-shadow:inset 0 -5px 6px rgba(0,0,0,.16),inset 0 4px 5px rgba(255,255,255,.5),0 3px 4px rgba(11,58,51,.3)}
.tab{position:relative;width:56%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 50%),var(--c);box-shadow:inset 0 -5px 7px rgba(0,0,0,.16),0 3px 4px rgba(11,58,51,.3)}
.tab::after{content:"";position:absolute;left:12%;right:12%;top:calc(50% - 1px);height:2px;border-radius:2px;background:rgba(0,0,0,.18)}

/* Pills drifting up behind the page */
.float{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.fp{position:absolute;bottom:-100px;left:var(--x);opacity:.5;animation:rise var(--d) linear infinite;animation-delay:var(--t)}
.fp.cap,.fp.tab{width:var(--s)}
@keyframes rise{to{transform:translateY(-125vh) rotate(360deg)}}

/* Layout */
.page{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:clamp(24px,5vw,56px)}
main{flex:1;width:100%;max-width:1080px;margin:0 auto;display:grid;align-content:center;gap:clamp(28px,5vw,52px) clamp(32px,7vw,96px);grid-template-areas:"head" "art" "info"}
.head{grid-area:head;container-type:inline-size}
.info{grid-area:info}
@media(min-width:880px){
  main{grid-template-columns:1.15fr .85fr;grid-template-areas:"head art" "info art"}
  .blister{align-self:center}
}

/* Text */
.status{display:inline-flex;align-items:center;gap:.6em;padding:.4em 1em .4em .8em;border-radius:99px;background:var(--amber);font-weight:600;font-size:.95rem}
.status::before{content:"";width:.6em;height:.6em;border-radius:50%;background:var(--ink)}
h1{font:800 clamp(2.2rem,10vw,4.4rem)/.9 "Bricolage Grotesque","Public Sans",system-ui,sans-serif;font-size:clamp(2.2rem,11.5cqw,5rem);letter-spacing:-.035em;margin:.28em 0 .3em}
.lead{max-width:30ch;font-size:1.2rem;color:var(--muted)}
dl{max-width:30rem;border-bottom:1px solid rgba(11,58,51,.2)}
dl div{display:grid;grid-template-columns:7rem 1fr;align-items:center;gap:1rem;padding:.9rem 0;border-top:1px solid rgba(11,58,51,.2)}
dt{font-size:.9rem;color:var(--muted)}
dd{font-weight:600}
.btn{display:inline-flex;align-items:center;gap:.5em;padding:.65em 1.2em;border-radius:99px;background:var(--green);color:#fff;font-weight:600;text-decoration:none;transition:background .2s}
.btn:hover{background:#09654A}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
footer{width:100%;max-width:1080px;margin:clamp(28px,5vw,48px) auto 0;font-size:.85rem;color:var(--muted)}

/* Blister pack: pills drop into the wells one by one */
.blister{grid-area:art;justify-self:center;width:min(100%,430px);padding:clamp(14px,3.5vw,22px);display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,2.6vw,16px);border-radius:26px;rotate:-3deg;background:linear-gradient(145deg,#F6FAFB,var(--foil) 45%,#C2D2D7);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(11,58,51,.12),0 26px 40px -18px rgba(11,58,51,.45)}
.w{aspect-ratio:1;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 34% 28%,#fff,#E8F1F3 38%,#BCCDD3);box-shadow:inset 0 3px 7px rgba(11,58,51,.28),0 1px 0 rgba(255,255,255,.9)}
.w .cap,.w .tab{animation:fill 10s infinite backwards;animation-delay:calc(var(--i) * .7s)}
@keyframes fill{
  0%{translate:0 -160%;scale:.5;opacity:0;animation-timing-function:cubic-bezier(.3,1.4,.5,1)}
  7%,90%{translate:0 0;scale:1;opacity:1}
  100%{translate:0 0;scale:.4;opacity:0}
}

@media(prefers-reduced-motion:reduce){
  .float{display:none}
  .w .cap,.w .tab{animation:none}
}
</style>
</head>
