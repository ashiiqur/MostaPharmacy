<style>
:root{--mint:#E6F3EE;--ink:#0B3A33;--muted:#34594F;--green:#0B7A57;--amber:#FFC233;--foil:#D3E1E5}
*{box-sizing:border-box;margin:0}
body{background:var(--mint);color:var(--ink);font:400 1.05rem/1.6 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}

* {
  -webkit-tap-highlight-color: transparent;
}

/* Pill shapes (used in the blister pack and in the background) */
.cap{width:78%;aspect-ratio:2.2;border-radius:99px;background:linear-gradient(90deg,var(--c) 50%,#fff 50%);rotate:var(--r,0deg);box-shadow:inset 0 -5px 6px rgba(0,0,0,.16),inset 0 4px 5px rgba(255,255,255,.5),0 3px 4px rgba(11,58,51,.3)}
.tab{position:relative;width:56%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 50%),var(--c);box-shadow:inset 0 -5px 7px rgba(0,0,0,.16),0 3px 4px rgba(11,58,51,.3)}
.tab::after{content:"";position:absolute;left:12%;right:12%;top:calc(50% - 1px);height:2px;border-radius:2px;background:rgba(0,0,0,.18)}

/* Pills drifting up behind the page */
/* Sized to the large viewport so the layer keeps one height while the mobile address bar shows and hides (no jump) */
.float{position:fixed;top:0;left:0;right:0;height:100vh;height:100lvh;overflow:hidden;pointer-events:none;contain:layout paint}
.fp{position:absolute;bottom:-100px;left:var(--x);width:var(--s);opacity:.5;will-change:transform;backface-visibility:hidden}
.fp i{display:block;width:100%}
.fp .cap,.fp .tab,.fp .mk{opacity:0}
.fp .mk img{display:block;width:100%;height:auto}
.fp svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fp .ln{fill:none;stroke:var(--c);stroke-width:1.4;stroke-dasharray:1;stroke-dashoffset:1}
.on .fp{animation:rise var(--d) linear var(--t) infinite}
.on .ln{animation:draw 1.6s ease-in-out var(--g) forwards,fade .6s ease calc(var(--g) + 1.7s) forwards}
